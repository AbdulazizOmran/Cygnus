<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the helper's name. Anyone may *call* it: every privileged action is
     authorized individually by polkit inside cygnus-helper. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.omranabdulaziz.Cygnus.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.omranabdulaziz.Cygnus.Helper1"
           send_interface="io.github.omranabdulaziz.Cygnus.Helper1"/>
    <allow send_destination="io.github.omranabdulaziz.Cygnus.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.omranabdulaziz.Cygnus.Helper1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
